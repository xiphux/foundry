# actionlint configuration — run by the `checks` job in ci.yml.
self-hosted-runner:
  # Not self-hosted: these are GitHub-hosted runners, newer than the label list
  # built into actionlint 1.7.12, which rejects them as unknown
  # (rhysd/actionlint#682). Upstream has had no release since March 2026, so
  # this vouches for them until one does; delete it then. It names only the
  # labels actionlint lacks, so a typo in any other runs-on still fails.
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  # release.yml is generated by dist (cargo-dist 0.31.0, see
  # dist-workspace.toml), and every shellcheck finding in it is in dist's own
  # generated scripts rather than the two hand-maintained Scoop jobs at the
  # bottom of the file.
  #
  # Two of them are deliberate unquoted expansions that shellcheck cannot know
  # are intended, and "fixing" them would break a release:
  #   - `$PRERELEASE_FLAG` expands to `--prerelease` or to nothing, so quoting
  #     it would pass an empty argument to `gh release create`.
  #   - `artifacts/*` is a glob that has to be split into one argument per
  #     file being uploaded.
  # The rest are style notes (SC2129 grouped redirects, SC2001 sed-versus-
  # parameter-expansion) about code this repository does not write.
  #
  # Only the shellcheck integration is filtered here, not actionlint itself:
  # its own checks — expression syntax, `needs` typos, unknown runner labels —
  # still run over release.yml, which is what would catch a bad hand-edit to
  # the Scoop jobs.
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC\d+:.+'
