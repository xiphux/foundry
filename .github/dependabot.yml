# Version-update PRs for GitHub Actions pins and for Cargo crates.
# Dependabot security updates are a separate repo setting and keep working
# regardless of what is here; `ignore` update-types and `cooldown` apply to
# version updates only, so a security fix that needs a major still arrives.
#
# Which of these PRs merge without a human is decided in
# workflows/dependabot-automerge.yml, not here.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily, not weekly, so PRs the auto-merge workflow held for being
      # behind main get the soonest chance of a rebase and re-test. Dependabot
      # documents rebasing on conflicts; a PR that is only behind may need a
      # manual `@dependabot rebase` (see workflows/dependabot-automerge.yml).
      interval: daily
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      # Daily for the same reason as above. Cooldown still sets how
      # often a given crate can actually change.
      interval: daily
    commit-message:
      prefix: deps
    # Majors are manual upgrades, done on purpose. Ignored rather than
    # proposed-and-held because Dependabot offers only a crate's newest
    # version: a pending major would replace the minor and patch updates
    # below. workflows/major-upgrade-check.yml opens an issue for each major
    # instead.
    #
    # A 0.x crate's breaking release (sha2 0.11 -> 0.12) may be classed as a
    # minor and proposed anyway; auto-merge holds it. The major check reports
    # it either way, since it compares by Cargo's own compatibility rule.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # Hold back releases younger than this. Hijacked releases are usually
    # caught and yanked within days, and most of these PRs merge unattended.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    # Every minor and patch in one PR. Each of these edits Cargo.lock, so of
    # several separate PRs auto-merge can land only one per rebase cycle (the
    # rest are behind main), re-running the full CI matrix on every one left
    # each time. One PR is one CI run and one merge.
    #
    # The cost: auto-merge holds a PR if ANY update in it is unsafe (a 0.x
    # minor, say), which parks the safe ones with it. Take the unsafe crate by
    # hand, or exclude it here with `exclude-patterns`, and the rest follow.
    groups:
      cargo-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
