# zizmor (GitHub Actions security linter) — run by the `workflow-lint` job in
# ci.yml. Every exception below is a finding that was read and judged, not
# silenced to get green. Add a new one only with the same kind of reason.
#
# Nearly all of these are in release.yml, which is GENERATED by dist
# (cargo-dist 0.31.0, see dist-workspace.toml). `allow-dirty = ["ci"]` means
# dist leaves the file alone rather than rewriting it, so these could be
# hand-patched — but the expressions below are dist's own release logic, they
# are exercised only by pushing a tag, and there is no way to test a change to
# them here short of cutting a release. Rewriting them would fork dist's
# generator output on a guess. Pinning the actions in that file was worth
# doing anyway, because swapping a tag for a SHA cannot change behaviour;
# rewriting how `dist build` is invoked can.
#
# These numbers have shifted twice, both times because a hand edit above them
# added lines. On 2026-09-20 by 9: custom-ci-gate (line 90) gained a
# `permissions:` block granting `actions: read`, which ci-gate.yml's own gate
# declares and which a caller must therefore grant. Then by a further 20, when
# the `host` job gained a dependency on custom-ci-gate plus the comment
# explaining it -- so only the two entries BELOW host moved, and the findings
# are dist's same expressions at new positions, re-read and unchanged in kind.
#
# That drift is now caught by tests/zizmor_config_test.rs rather than by a red
# CI run on a tag-shaped change nobody could test locally: every
# template-injection line below must still be a line that interpolates.
#
# Ignores are LINE-scoped on purpose, not whole-file. release.yml also holds
# two hand-maintained jobs (publish-scoop-manifest and the Scoop step in
# announce, from line ~341), which are ours to fix and are clean today. A
# whole-file ignore would silence a future finding there. If dist ever
# regenerates the file the line numbers shift, and a stale entry stops
# matching — which makes the finding reappear rather than stay hidden.
rules:
  # dist's own release logic, all of it reached only on a tag push (or the
  # `plan` job on a PR):
  #   80, 313  — github.ref_name / needs.plan.outputs.tag, i.e. the tag being
  #              released. Pushing a tag to this repository already requires
  #              write access, so this is not a boundary an outsider crosses.
  #   145, 155 — matrix.install_dist.run and matrix.packages_install, both
  #              read out of the manifest `dist plan` builds from
  #              dist-workspace.toml, which lives in this repository.
  #   159, 212, 282 — needs.plan.outputs.tag-flag and matrix.dist_args, same
  #              manifest, same provenance.
  template-injection:
    ignore:
      - release.yml:80
      - release.yml:145
      - release.yml:155
      - release.yml:159
      - release.yml:212
      - release.yml:282
      - release.yml:313

  # `contents: write` at the top of release.yml. dist generates it and the
  # workflow genuinely needs it: it creates the GitHub Release and uploads
  # every artifact to it. The narrower alternative is per-job permissions,
  # which is a change to generated content for no reduction in what the
  # publishing jobs can do.
  excessive-permissions:
    ignore:
      - release.yml:18

  # `container: ${{ matrix.container && matrix.container.image || null }}`.
  # The image is chosen per matrix entry by dist's plan, so there is no
  # literal reference here to pin; pinning would mean pinning inside dist.
  unpinned-images:
    ignore:
      - release.yml:125

  # dist's generated `custom-ci-gate` job, which calls ./.github/workflows/
  # ci-gate.yml (the plan-jobs entry in dist-workspace.toml).
  #
  # secrets-inherit: the called workflow builds and tests and reads no secret;
  # it now declares `permissions: contents: read` of its own, so what it
  # inherits is bounded regardless.
  #
  # self-repository: suggests `uses: $/...` over `./...`. The `./` form
  # resolves from the caller's own commit, which is what a release gate wants,
  # and this is generated content — not worth diverging over a style hint.
  secrets-inherit:
    ignore:
      - release.yml:91
  self-repository:
    ignore:
      - release.yml:91

  # `workflow_run` is dangerous when the privileged run checks out or executes
  # the triggering PR's code. This one does neither: it has no checkout step
  # at all, reads PR and commit metadata through the API, requires a
  # Dependabot-authored head commit whose SHA is the one CI passed, and its
  # only write is `gh pr merge`. The header of that file explains why it
  # cannot live inside ci.yml instead.
