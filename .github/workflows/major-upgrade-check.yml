# Keeps one open issue per available major upgrade, and closes it once the
# upgrade has landed.
#
# Dependabot ignores majors on purpose: it proposes only a crate's newest
# version, so a pending major would take the place of the minor and patch
# updates that auto-merge, and those would stop until the major was done.
# This is how a major gets noticed instead — a to-do item, not a PR that
# blocks the others. See .github/scripts/major-upgrade-issues.sh for what
# counts as a major and how issues are matched.
name: Major upgrade check

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Open, update and close upgrade issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/major-upgrade-issues.sh
