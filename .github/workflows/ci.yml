name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default, for every job here. Nothing in CI writes to the
# repository: whatever merges a green pull request does so with its own
# credentials, never this workflow's. A job that needs more has to say so
# itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Has this exact content already gone green on the pull request that merged
  # it? If so every check below skips, because running them again would test
  # the same bytes a second time.
  #
  # HEAD is the merge commit and its second parent is the branch that merged.
  # Equal TREES mean byte-identical checkouts — a tree object hashes the
  # complete recursive listing, every path, mode and blob — while saying
  # nothing about lineage, message or commit hash. Equality also proves the
  # branch was up to date when it merged: had main moved ahead, the merge
  # would have folded those commits into the tree and the hashes would
  # differ, so the case that must not inherit — a branch tested against an
  # older main, merged onto a newer one, never tested in combination — is
  # excluded by the comparison itself.
  #
  # Tree equality says the content was TESTED; the run lookup says it PASSED.
  # Both must hold. A direct push to main is single-parent, matches nothing,
  # and runs the full suite.
  #
  # Not on pull requests, deliberately: there the checkout is the merge ref,
  # itself a merge commit whose second parent is the branch head, so the
  # comparison would be against the very branch under test and the lookup
  # would find that branch's own runs. A pull request must never certify
  # itself. Because this job can therefore skip, every check carries
  # `!cancelled()` — without it a skipped gate would skip the whole suite,
  # since a plain expression does not override the success-gating a skipped
  # dependency imposes.
  #
  # The release path has its own copy of this reasoning in ci-gate.yml, which
  # covers the OTHER duplicate: a tag re-running what main already ran over
  # the same commit.
  #
  # Fails closed throughout: a re-run, a non-merge commit, a missing parent,
  # differing trees, an absent, running or failed run, or the step erroring
  # all leave `passed` unset, and `passed=true` is written on the last line
  # of the script and nowhere else.
  gate:
    name: Check for an earlier pass
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      # For the run lookup below.
      actions: read
    outputs:
      passed: ${{ steps.inherit.outputs.passed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents is all this needs. If a fetch
          # ever comes back without the second parent, `rev-parse` fails and
          # the step falls through to running the checks.
          fetch-depth: 2
          persist-credentials: false

      - name: Inherit the merged branch's result
        id: inherit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A re-run is somebody asking for these checks to actually run.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "Attempt ${GITHUB_RUN_ATTEMPT:-1}: re-checking rather than inheriting."
            exit 0
          fi

          if ! pr_head=$(git rev-parse -q --verify 'HEAD^2'); then
            echo "HEAD is not a merge commit; nothing to inherit."
            exit 0
          fi

          head_tree=$(git rev-parse 'HEAD^{tree}')
          pr_tree=$(git rev-parse "${pr_head}^{tree}")

          if [ "${head_tree}" != "${pr_tree}" ]; then
            echo "Tree ${head_tree} differs from ${pr_head}'s ${pr_tree}."
            echo "The merge combined two lines nothing has tested together."
            exit 0
          fi

          # A `pull_request` run reports the branch head as `head_sha`, even
          # though it checks out the merge ref — which is what makes this
          # findable. `last` takes the most recent, so a re-run supersedes
          # the run it repeated.
          conclusion=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${pr_head}&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.path == ".github/workflows/ci.yml"
                            and .event == "pull_request")]
                  | sort_by(.run_started_at) | last | .conclusion // empty')

          if [ "${conclusion}" != "success" ]; then
            echo "No successful ci.yml run for ${pr_head} (got: ${conclusion:-none})."
            exit 0
          fi

          echo "Identical tree to ${pr_head}, whose CI passed. Inheriting it."
          echo "passed=true" >> "${GITHUB_OUTPUT}"

  test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform should not hide whether the others pass.
      fail-fast: false
      matrix:
        # Every platform release ships to is built here, because Dependabot
        # PRs auto-merge on a green run and cargo-dist only builds on a tag:
        # otherwise a dependency update that broke one would first fail at
        # release. Windows ships via Scoop; ubuntu-24.04-arm covers
        # aarch64-unknown-linux-gnu, and the macOS leg (arm64) also builds
        # x86_64-apple-darwin below.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # runner.arch too: both Linux legs report runner.os "Linux".
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # A PR that changes Cargo.lock (every Cargo Dependabot PR) misses the
          # exact key; start from the newest cache for this platform instead
          # of cold.
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Configure git
        run: |
          git config --global user.email "ci@foundry.dev"
          git config --global user.name "CI"

      - name: Check formatting
        run: cargo fmt -- --check

      # --locked throughout: a Cargo.lock that disagrees with Cargo.toml fails
      # instead of being quietly rewritten for the run. --all-targets so the
      # tests are linted as well.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --locked --release

      - name: Build for x86_64 macOS
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked --target x86_64-apple-darwin

  # A stable check name for "did the platform matrix pass?", which is what a
  # required status check needs and what `test` cannot provide. GitHub names a
  # matrix job's check runs after its values — `test (ubuntu-latest)`,
  # `test (ubuntu-24.04-arm)`, and so on — while a required check names one
  # fixed string, configured in the repository settings where nothing links it
  # back to this file. So the day the matrix moves, and `ubuntu-24.04-arm`
  # says it eventually will, the old names stop being reported and the
  # required check waits for them forever: the pull request making the change
  # cannot merge, and neither can any after it. Requiring `test-result`
  # instead leaves the platform list free to move.
  #
  # It is NOT a second opinion on the tests. It reads `needs.test.result` and
  # nothing else, so it cannot disagree with the matrix about whether it
  # passed, and it fails closed — anything that is not `success` or `skipped`
  # exits 1, an empty result included. `fail-fast: false` above means a red
  # platform still leaves the others reporting, and `needs.test.result` is
  # `failure` if any leg failed, so one bad platform is still caught here.
  #
  # `skipped` passes because `gate` is allowed to stand the checks down when
  # this exact content already went green; that judgement belongs to `gate`,
  # and this job only reports what happened.
  test-result:
    needs: [gate, test]
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every platform passed, or the gate stood them down
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          case "${RESULT}" in
            success | skipped) echo "test: ${RESULT}" ;;
            *) echo "test: ${RESULT}" >&2; exit 1 ;;
          esac

  # Fails if line coverage drops below the floor, so tests cannot quietly
  # thin out underneath auto-merge. Raise the floor as coverage grows; it is
  # set a little under the measured figure so platform noise does not flake.
  coverage:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-llvm-cov

      - name: Configure git
        run: |
          git config --global user.email "ci@foundry.dev"
          git config --global user.name "CI"

      - name: Check coverage
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 72

  audit:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      # Keyed on the newest release, so a new cargo-audit (which can be needed
      # to parse newer advisories) replaces the cached binary instead of the
      # first one ever installed being reused forever. Fails rather than
      # proceed without a version: an empty one would make the key constant
      # again, and pin whatever got cached under it.
      - name: Resolve cargo-audit version
        id: cargo-audit
        run: |
          set -euo pipefail
          version=$(curl -fsS --max-time 30 -A 'foundry CI (https://github.com/xiphux/foundry)' \
            https://crates.io/api/v1/crates/cargo-audit | jq -r '.crate.max_stable_version // empty')
          if [ -z "$version" ]; then
            echo "::error::Could not resolve the latest cargo-audit version from crates.io"
            exit 1
          fi
          # Shape-check what a third party just handed us, before it reaches a
          # cache key and a cargo argument. A version is digits and dots with
          # an optional pre-release/build suffix; anything else is a wrong or
          # tampered-with response and should stop the run rather than travel
          # any further.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::crates.io returned an implausible cargo-audit version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ steps.cargo-audit.outputs.version }}

      # The version goes through the environment rather than being expanded
      # into the script: `${{ }}` is substituted as text before bash sees the
      # line, so a value containing shell metacharacters would run as code.
      # It comes from a crates.io response, which this workflow does not
      # control.
      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        env:
          CARGO_AUDIT_VERSION: ${{ steps.cargo-audit.outputs.version }}
        run: cargo install cargo-audit --locked --force --version "$CARGO_AUDIT_VERSION"

      # Checks Cargo.lock against the RustSec advisory database. Runs as its
      # own job so a new advisory against a dependency does not read as a test
      # failure, and so it reports even when the build matrix is red. A new
      # advisory against something already locked holds every Dependabot PR
      # until it is dealt with, on purpose.
      - name: Audit dependencies
        run: cargo audit --deny warnings

      # The other half of dependency hygiene: a crate still declared after the
      # code that used it went away. Nothing else notices — it builds, it
      # locks, it passes clippy, and Dependabot keeps proposing updates for it
      # (and auto-merging them) forever.
      #
      # In this job rather than its own: both read Cargo.toml/Cargo.lock rather
      # than the build, and a second job would spend a runner start on a check
      # that takes under a second. `!cancelled()` so an advisory does not hide
      # an unused crate, or the reverse.
      - name: Install cargo-machete
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-machete

      # cargo-machete reads the sources rather than building them, so a crate
      # reachable only through a macro expansion or a `cfg` this platform does
      # not compile can read as unused. There is nothing in that position here
      # today; when there is, it goes in `[package.metadata.cargo-machete]` in
      # Cargo.toml with the reason beside it, not behind --skip-analysis.
      - name: Check for unused dependencies
        if: ${{ !cancelled() }}
        run: cargo machete

  # Backstop for GitHub's secret scanning and push protection, and the check
  # that runs on the PR itself. Pinned by digest; bump the tag and digest
  # together. --redact keeps a real hit out of the public job log.
  # --log-opts=HEAD scans the history of the commit under test only: gitleaks
  # defaults to `git log --all`, and fetch-depth 0 fetches every remote branch,
  # so a finding on a stale, unrelated branch would otherwise fail every PR.
  # Reviewed false positives go in .gitleaksignore (history) or as an inline
  # `gitleaks:allow` comment (current tree).
  secrets:
    name: Secret scan
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --no-banner --verbose --log-opts=HEAD

  # The workflows themselves. actionlint catches mistakes GitHub only reports
  # by failing a run — bad expressions, `needs` typos, unknown runner labels,
  # shellcheck findings inside `run:` blocks. zizmor catches security ones —
  # unpinned actions, template injection, permissions wider than a job needs,
  # credentials left behind by a checkout. Both matter more here than the
  # linting of any one script: these files hold the release tokens, and a
  # green run here is what lets an automated update merge.
  #
  # Each tool's intentional exceptions live in its own config, with the
  # reasoning next to them: .github/actionlint.yaml and .github/zizmor.yml.
  #
  # No Rust and no build, so it finishes in seconds and does not queue behind
  # the matrix.
  workflow-lint:
    name: Workflow lint
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary from GitHub, checksum-pinned: this job gates what
      # auto-merge may merge, so the tool that judges it is fetched by a hash
      # rather than a tag someone else can move. Bump the version and the
      # checksum together (the release publishes a checksums.txt).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # `if: !cancelled()` so a finding from one tool still lets the other
      # report, rather than fixing them one CI run at a time.
      #
      # Online audits use the job's read-only token to check that each SHA pin
      # is a real commit of the repository named, and that it matches the
      # `# vX.Y.Z` comment beside it. Annotations rather than a SARIF upload,
      # which would need security-events: write.
      #
      # The action only runs zizmor versions in its own table (pulled by
      # digest), so `version` has to be one this pinned release knows: bumping
      # zizmor past it fails with "Unknown version" until the action is
      # bumped too.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
