name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform should not hide whether the others pass.
      fail-fast: false
      matrix:
        # Windows because it ships (x86_64-pc-windows-msvc, via Scoop) and
        # Dependabot PRs auto-merge on a green run: without it, a dependency
        # update that breaks the Windows build would first fail at release.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure git
        run: |
          git config --global user.email "ci@foundry.dev"
          git config --global user.name "CI"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keyed on the newest release, so a new cargo-audit (which can be needed
      # to parse newer advisories) replaces the cached binary instead of the
      # first one ever installed being reused forever. Fails rather than
      # proceed without a version: an empty one would make the key constant
      # again, and pin whatever got cached under it.
      - name: Resolve cargo-audit version
        id: cargo-audit
        run: |
          set -euo pipefail
          version=$(curl -fsS --max-time 30 -A 'foundry CI (https://github.com/xiphux/foundry)' \
            https://crates.io/api/v1/crates/cargo-audit | jq -r '.crate.max_stable_version // empty')
          if [ -z "$version" ]; then
            echo "::error::Could not resolve the latest cargo-audit version from crates.io"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ steps.cargo-audit.outputs.version }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --force --version "${{ steps.cargo-audit.outputs.version }}"

      # Checks Cargo.lock against the RustSec advisory database. Runs as its
      # own job so a new advisory against a dependency does not read as a test
      # failure, and so it reports even when the build matrix is red. A new
      # advisory against something already locked holds every Dependabot PR
      # until it is dealt with, on purpose.
      - name: Audit dependencies
        run: cargo audit --deny warnings

  # Backstop for GitHub's secret scanning and push protection, and the check
  # that runs on the PR itself. Pinned by digest; bump the tag and digest
  # together. --redact keeps a real hit out of the public job log.
  # --log-opts=HEAD scans the history of the commit under test only: gitleaks
  # defaults to `git log --all`, and fetch-depth 0 fetches every remote branch,
  # so a finding on a stale, unrelated branch would otherwise fail every PR.
  # Reviewed false positives go in .gitleaksignore (history) or as an inline
  # `gitleaks:allow` comment (current tree).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --no-banner --verbose --log-opts=HEAD
