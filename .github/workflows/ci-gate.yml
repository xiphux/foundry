name: CI Gate

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string

# Called from release.yml, which declares contents: write for the release
# itself. This gate only builds and tests, so it takes the minimum instead
# of inheriting that. `gate` asks for `actions: read` on its own, to look up
# whether this commit has already been checked.
permissions:
  contents: read

jobs:
  # A release tag points at a commit main was already pushed with, and ci.yml
  # checked it then — the same fmt, clippy and test steps `ci-gate` repeats
  # below. Identical SHA is the strongest evidence there is: not a comparison
  # of trees, the same object.
  #
  # So this asks whether a successful ci.yml run exists for this very commit,
  # and skips the work if one does. It is the release half of the pair; the
  # other half lives in ci.yml, where a push to main inherits the pull
  # request's pass by comparing trees.
  #
  # THE INVARIANT THAT MATTERS, and the reason this job exists rather than
  # just an `if:` on `ci-gate`: a called workflow whose jobs ALL skip
  # concludes as *skipped*, not success. release.yml's
  # `build-local-artifacts` has `needs: [plan, custom-ci-gate]`, so a skipped
  # conclusion here would skip the build and turn a release into a green run
  # that produced no artifacts. `gate` always runs and always concludes, so
  # the workflow resolves to success even when `ci-gate` skips. release.yml
  # is autogenerated by dist and must not be edited to work around this.
  #
  # Fails closed: a re-run, an absent, running or failed run, or the step
  # erroring at all leave `passed` unset, and anything but the exact string
  # 'true' runs the checks.
  gate:
    name: Check for an earlier pass
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.inherit.outputs.passed }}
    steps:
      - name: Look for a passing run of this commit
        id: inherit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A re-run is somebody asking for these checks to actually run.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "Attempt ${GITHUB_RUN_ATTEMPT:-1}: re-checking rather than inheriting."
            exit 0
          fi

          # ci.yml runs on pushes to main, so the run that checked this
          # commit is one of its own — this workflow has no earlier run to
          # find, being called only from a tag.
          conclusion=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.path == ".github/workflows/ci.yml")]
                  | sort_by(.run_started_at) | last | .conclusion // empty')

          if [ "${conclusion}" != "success" ]; then
            echo "No successful ci.yml run for ${GITHUB_SHA} (got: ${conclusion:-none})."
            exit 0
          fi

          echo "${GITHUB_SHA} has already passed ci.yml. Inheriting that."
          echo "passed=true" >> "${GITHUB_OUTPUT}"

  ci-gate:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      # rust-cache for the reason ci.yml's test job gives: a hand-rolled key
      # without the Rust version goes stale every stable release and, having
      # "hit", never saves the rebuilt target/.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Configure git
        run: |
          git config --global user.email "ci@foundry.dev"
          git config --global user.name "CI"
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
