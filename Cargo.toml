[package]
name = "foundry"
version = "0.6.1"
edition = "2024"
description = "CLI for managing AI agent workspaces using git worktrees and terminal automation"
repository = "https://github.com/xiphux/foundry"
homepage = "https://github.com/xiphux/foundry"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
dirs = "6"
which = "8"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
